# Lives at the repo root so ansible auto-discovers it from here — run playbooks
# from the repo root, not from ansible/. Paths below are relative to this file's
# directory (the repo root), hence the ansible/ prefix.
[defaults]
vault_password_file = ansible/vault-password.sh
interpreter_python = /usr/bin/python3
deprecation_warnings = False
inject_facts_as_vars = True
roles_path = ansible/roles
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400
inventory = ansible/hosts

[ssh_connection]
ssh_args = -o IdentityAgent=~/.bitwarden-ssh-agent.sock -C -o ControlMaster=auto -o ControlPersist=60s