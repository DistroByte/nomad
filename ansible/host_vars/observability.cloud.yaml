---
tailnet_ipv4: 100.64.0.7

tailscale_advertise_routes: ""
tailscale_exit_node: true
tailscale_hostname: observability

# Do not take DNS from the tailnet. MagicDNS now points at dionysus
# (192.168.0.5), a LAN address reachable only via hermes' subnet route — so
# accepting it made this host's DNS depend on the home network it exists to
# front. It broke on 2026-09-18 when this node was brought back onto the
# tailnet: no route arrived, so every lookup timed out. Same reasoning already
# applied to worker.cloud. Oracle's resolver is used instead.
tailscale_accept_dns: false
