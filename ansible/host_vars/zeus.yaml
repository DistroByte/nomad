---
tailnet_ipv4: 100.64.0.8

# Second subnet router, so a roaming client can still reach the LAN when hermes
# is down. Routes must be approved in headscale afterwards — the post-play in
# ansible/playbooks/tailscale.yaml does that.
tailscale_advertise_routes: "192.168.0.0/24"

# zeus is inside 192.168.0.0/24, the subnet it and hermes advertise.
tailscale_accept_routes: false

# zeus serves the tailnet's DNS — same reasoning as hermes.
tailscale_accept_dns: false

# TEMPORARY while the ISP withholds IPv4. Hostname, not tailnet IP — resolved
# from the netmap, survives headscale reallocating addresses.
tailscale_exit_node_use: "observability"

nomad_host_volumes:
  - name: immich-postgres-replica
    path: /opt/nomad/volumes/immich-postgres-replica
    owner: "{{ postgres_uid }}"
    group: "{{ postgres_gid }}"

nomad_usb_plugin_enabled: true
