---
# Pushes the split-DNS records generated from jobs/ to the two resolvers that
# serve them: the Pi-hole pair for LAN and subnet-routed clients, and headscale
# for roaming ones.
#
# scripts/sync-dns.sh is the generator and the only place the Host() rules are
# read; this playbook is the delivery mechanism. Run it whenever a job's Host()
# rule changes — the untracked .git/hooks/post-commit does the Pi-hole half
# automatically, but only ansible pushes the headscale half.
#
# Deploy:
#   ansible-playbook ansible/playbooks/dns.yaml
- name: Generate the records
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Render the dnsmasq lines and the headscale extra records
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../../scripts/sync-dns.sh {{ item }}"
      register: dns_artefacts
      changed_when: false
      loop:
        - dnsmasq
        - extra-records

    - name: Keep the generated records for the later plays
      ansible.builtin.set_fact:
        dns_dnsmasq_lines: "{{ dns_artefacts.results[0].stdout_lines }}"
        dns_extra_records: "{{ dns_artefacts.results[1].stdout }}"

    - name: Check the records parse before anything installs them
      # The real risk with extra-records.json is shipping something headscale
      # cannot parse, and that is answerable here with a parser rather than by
      # grepping the control plane's logs afterwards.
      ansible.builtin.assert:
        that:
          - dns_extra_records | from_json is iterable
          - dns_extra_records | from_json | length > 0
          - dns_extra_records | from_json | map(attribute='name') | select('search', '^headscale\\.') | list | length == 0
        fail_msg: >-
          scripts/sync-dns.sh produced records that are not a usable JSON array,
          or that include a headscale hostname (which must never point inward).
        quiet: true

- name: Push the dnsmasq lines to both Pi-holes
  hosts: pihole
  become: true
  gather_facts: false
  serial: 1

  vars:
    pihole_api: "http://127.0.0.1:{{ pihole_web_port }}/api"

  tasks:
    - name: Log in to the local API
      ansible.builtin.uri:
        url: "{{ pihole_api }}/auth"
        method: POST
        body_format: json
        body:
          password: "{{ pihole_password }}"
      register: dns_pihole_auth
      no_log: true
      changed_when: false

    - name: Replace misc.dnsmasq_lines
      # A whole-array PATCH, so anything not generated is removed. FTL validates
      # the resulting dnsmasq config and refuses the change rather than
      # restarting into a broken state.
      ansible.builtin.uri:
        url: "{{ pihole_api }}/config"
        method: PATCH
        headers:
          X-FTL-SID: "{{ dns_pihole_auth.json.session.sid }}"
        body_format: json
        body:
          config:
            misc:
              dnsmasq_lines: "{{ hostvars['localhost'].dns_dnsmasq_lines }}"
      changed_when: true

    - name: Confirm the resolver still answers for a generated name
      ansible.builtin.command:
        argv:
          - dig
          - +short
          - +timeout=2
          - "@127.0.0.1"
          - vault.dbyte.xyz
      register: dns_pihole_verify
      changed_when: false
      failed_when: dns_pihole_verify.stdout | trim == ''

    - name: Close the API session
      ansible.builtin.uri:
        url: "{{ pihole_api }}/auth"
        method: DELETE
        headers:
          X-FTL-SID: "{{ dns_pihole_auth.json.session.sid }}"
        status_code: [200, 204, 410]
      changed_when: false

- name: Push the extra records to the control plane
  hosts: headscale
  become: true
  gather_facts: false

  tasks:
    - name: Stage the extra records next to their destination
      # Same filesystem as the destination, so the move below is atomic.
      ansible.builtin.copy:
        content: "{{ hostvars['localhost'].dns_extra_records }}\n"
        dest: "{{ headscale_deploy_dir }}/data/.extra-records.json.new"
        owner: root
        group: root
        mode: "0644"
      register: dns_extra_staged

    - name: Move the extra records into place  # noqa: no-handler
      # headscale watches this path with fsnotify and reloads on change. It must
      # be replaced by rename, never written in place: a partial write is a
      # parse error, and headscale issue #2753 is exactly that failure.
      ansible.builtin.command:
        argv:
          - mv
          - "{{ headscale_deploy_dir }}/data/.extra-records.json.new"
          - "{{ headscale_deploy_dir }}/data/extra-records.json"
      when: dns_extra_staged.changed
      changed_when: true

    - name: Drop the staged copy when nothing changed
      ansible.builtin.file:
        path: "{{ headscale_deploy_dir }}/data/.extra-records.json.new"
        state: absent
      when: not dns_extra_staged.changed

    - name: Check whether the control plane is configured to read the records
      # headplane edits the deployed config in place, so the repo copy is not
      # what runs. Until dns.extra_records_path is hand-applied there, this file
      # is staged and inert — and asserting a successful reload would be
      # asserting something that cannot have happened.
      ansible.builtin.command:
        argv: [grep, -c, "extra_records_path", "{{ headscale_deploy_dir }}/data/config.yaml"]
      register: dns_headscale_configured
      changed_when: false
      failed_when: false

    - name: Point out that the records are staged but not yet read
      ansible.builtin.debug:
        msg: >-
          extra-records.json is in place on {{ inventory_hostname }}, but
          dns.extra_records_path is not in the deployed config, so headscale is
          not reading it yet. Hand-apply the dns: block from
          external/headscale/config.yaml to
          {{ headscale_deploy_dir }}/data/config.yaml and restart the container
          — see the cutover order in docs/DNS.md. Roaming clients keep resolving
          via the old nameserver until then.
      when: dns_headscale_configured.stdout | trim | int == 0

    - name: Show what the control plane made of the reload
      # Deliberately reports rather than asserts. A regex over log text as a
      # failed_when broke three separate ways here — always-true through Jinja's
      # `is` binding tighter than `~`, then a non-boolean conditional — and it
      # was never the right tool: the records are validated by a parser at
      # generation time, and headscale keeps serving the previous set on a parse
      # error rather than failing loudly. Read these lines if DNS looks wrong.
      ansible.builtin.command:
        argv: [docker, logs, --since, 60s, headscale]
      register: dns_headscale_logs
      changed_when: false
      when: dns_headscale_configured.stdout | trim | int > 0

    - name: Report any record-related lines
      ansible.builtin.debug:
        msg: >-
          {{ dns_headscale_logs.stdout_lines | default([])
             | select('search', '(?i)record') | list
             | default(['(no record-related log lines in the last 60s)'], true) }}
      when: dns_headscale_configured.stdout | trim | int > 0
