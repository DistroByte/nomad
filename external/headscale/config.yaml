# Serves TLS via Caddy in front, so headscale itself stays plain HTTP on the
# compose network. server_url is unchanged from the Nomad deployment — it is
# baked into every registered node, so changing it would strand them.
server_url: https://headscale.dbyte.xyz
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Must match the migrated database — nodes already hold addresses from these
# ranges and sequential allocation depends on them.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

dns:
  magic_dns: true
  base_domain: ts.dbyte.xyz
  nameservers:
    global:
      # dionysus, the only remaining resolver. The hermes/zeus Pi-hole pair that
      # used to sit here (100.64.0.1 / 100.64.0.8) was decommissioned on
      # 2026-09-14 and neither node answers on :53 any more.
      #
      # This is a LAN address, not a tailnet one, because dionysus is not a
      # tailnet node. That is a real regression from the pair: reaching it now
      # depends on hermes advertising 192.168.0.0/24 and that route being
      # approved and up, where the old entries resolved over a direct peer path
      # and depended on neither. Putting tailscale on the NAS would restore the
      # stronger guarantee.
      #
      # Still deliberately one entry and no public fallback: a fallback would
      # answer `.internal` and `.consul` names publicly instead of failing, and
      # would quietly bypass blocking. See the break-glass note in docs/DNS.md
      # for what to do when home is unreachable.
      - 192.168.0.5

  # Answers for private service names, served straight out of the control plane
  # so a roaming client resolves them even before it can reach a resolver.
  # Generated by scripts/sync-dns.sh and delivered by
  # ansible/playbooks/dns.yaml, which replaces the file by rename because
  # headscale watches it with fsnotify.
  extra_records_path: /var/lib/headscale/extra-records.json

log:
  level: info

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

policy:
  mode: database
