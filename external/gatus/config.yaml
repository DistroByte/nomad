  - name: nomad-zeus
    group: internal
    url: "http://192.168.0.3:4646/v1/agent/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: consul-zeus
    group: internal
    url: "http://192.168.0.3:8500/v1/status/leader"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] != \"\""
    alerts:
      - type: ntfy

  - name: traefik-ping
    group: internal
    url: "http://192.168.0.4:8081/ping"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: pihole-dns
    group: internal
    url: "192.168.0.5"
    interval: 60s
    dns:
      query-name: "dbyte.xyz"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: ntfy

  - name: synology-dsm
    group: internal
    url: "tcp://192.168.0.5:5001"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: ntfy

external-endpoints:
  - name: heartbeat
    group: core
    token: "${HEARTBEAT_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: ntfy
